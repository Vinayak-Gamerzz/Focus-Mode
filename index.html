<!DOCTYPE html>

<html lang="en">

    <head>

        <tile>Focus Mode On</tile>

        <link rel="stylesheet" href="style.css">

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>

    <body>

        <div class="container">

            <h1>Pomodoro Focus</h1>

                <div class="mode" id="mode">

                    Focus Time

                </div>

                <div class="timer" id="timer">

                    25:00

                </div>

                <div class="session">

                    Session <span id="session">1</span>/4

                </div>

                <div class="buttons">

                    <button id="start">

                        Start

                    </button>

                    <button id="pause">

                        Pause

                    </button>

                    <button id="reset">

                        Reset

                    </button>

                </div>

                    <hr>

                    <h2>To-Do List</h2>

                <div class="todo">

                    <imput id="todoInput" type="text" placeholder="Add a Task"/>

                        <button id="addTask">

                            Add

                        </button>

                    <ul id="todoList"></ul>

                </div>

        </div>

        <script src="script.js"></script>

    </body>

</html>
