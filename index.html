<!DOCTYPE html>

<html lang="en">

    <head>

        <title>Focus Mode On</title>

        <link rel="stylesheet" href="style.css">

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>

    <body>

        <button id="settingsBtn" class="settings-btn">
            ⚙
        </button>

        <div class="container">

            <h1>Pomodoro Focus</h1>

                <div class="mode" id="mode">

                    Focus Time

                </div>

                <div class="timer" id="timer">

                    25:00

                </div>

                <div class="session">

                    Session <span id="session">1</span>/4

                </div>

                <div class="buttons">

                    <button id="start">

                        Start

                    </button>

                    <button id="pause">

                        Pause

                    </button>

                    <button id="reset">

                        Reset

                    </button>

                </div>

                    <hr>

                    <h2>To-Do List</h2>

                <div class="todo">

                    <input id="todoInput" type="text" placeholder="Add a Task"/>

                        <button id="addTask">

                            Add

                        </button>

                    <ul id="todoList"></ul>

                </div>

        </div>

        <div class="modal" id="settingsModal">

            <div class="modal-box">

                <div class="modal-top">

                        <h2>⚙ Settings</h2>

                        <span id="closeModal">&times;</span>

                </div>

                    <hr>

                <div class="theme-setting">

                        <span>Dark Theme</span>

                        <label class="switch">

                            <input type="checkbox" id="themeToggle">

                            <span class="slider"></span>

                        </label>

                </div>

            </div>

        </div>

        <script src="script.js"></script>

    </body>

</html>
