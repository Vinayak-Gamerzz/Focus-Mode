<!DOCTYPE html>

<html lang="en">

    <head>

        <title>Focus Mode On</title>

        <link rel="stylesheet" href="style.css">

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>

    <body>

    <div class="sidebar">

        <div class="menu-icon">

            ☰

        </div>

            <button id="notesBtn" class="sidebar-btn">

                Notes

            </button>

            <button id="statsMenu" class="sidebar-btn">

                Stats

            </button>

            <button id="settingsBtn" class="sidebar-btn">

                Settings

            </button>

            <button id="todoBtn" class="sidebar-btn">

                To-Do

            </button>

            <button id="musicBtn" class="sidebar-btn">

                Music

            </button>

            <button id="fullscreenBtn" class="sidebar-btn">

                ⛶

            </button>

    </div>



        <div class="notes-panel" id="notesPanel">

            <div class="notes-top">

                <h2>Notes</h2>

                <span id="closeNotes">&times;</span>

            </div>

            <textarea id="notesText" placeholder="Write your notes here..."></textarea>

                <div class="notes-buttons">

                    <button id="saveNotes">Save</button>

                    <button id="clearNotes">Clear</button>

                </div>

        </div>

        <div class="stats-panel" id="statsPanel">

            <div class="stats-top">

                <h2>Statistics</h2>

                <span id="closeStats">&times;</span>

            </div>

            <div class="stats-card">

                <p>Today's Sessions <span id="todaySessions">0</span></p>

                <p>Total Sessions <span id="totalSessions">0</span></p>

                <p>Focus Time <span id="focusTimeStat">0 min</span></p>

                <p>Completed Tasks <span id="completedTasks">0</span></p>

            </div>

        </div>

        <div class="todo-panel" id="todoPanel">

            <div class="todo-top">

                <h2>To-Do</h2>

                <span id="closeTodo">&times;</span>

            </div>

                <input id="todoInput" placeholder="Add Task">

                    <button id="addTask">Add</button>

                <ul id="todoList"></ul>

        </div>

        <div class="music-panel" id="musicPanel">

            <div class="music-top">

                <h2>Music</h2>

                <span id="closeMusic">&times;</span>

            </div>

                <button class="music-option" data-music="off">

                    Off

                </button>

                <button class="music-option" data-music="lofi">

                    Lofi

                </button>

                <button class="music-option" data-music="rain">

                    Lofi Rain

                </button>

                <button class="music-option" data-music="forest">

                    Enchanted Forest

                </button>

                <button class="music-option" data-music="cafe">

                    Lofi Cafe

                </button>

            <hr>

            <label>Volume</label>

            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">

        </div>

        <div class="container">

            <h1>Pomodoro Focus</h1>

                <div class="timer-modes">

                    <button id="focusBtn" class="mode-btn active">Focus</button>

                    <button id="shortBtn" class="mode-btn">Short Break</button>

                    <button id="longBtn" class="mode-btn">Long Break</button>

                </div>

                    <div class="evolution">

                            <div class="stage active">

                                    <img src="pikachu_egg.png">

                                    <p>Egg</p>

                            </div>

                            <div class="stage">

                                    <img src="pika_pika.png">

                                    <p>Pikachu</p>

                            </div>

                            <div class="stage">

                                    <img src="pikachu.png">

                                    <p>Pikachu</p>

                            </div>

                            <div class="stage">

                                    <img src="raichu.png">

                                    <p>Raichu</p>

                            </div>

                    </div>

                        <div class="mode" id="mode">

                            Focus Time

                        </div>

                        <div class="timer" id="timer">

                            25:00

                        </div>

                        <div class="session">

                            Session <span id="session">1</span>/4

                        </div>

                        <div class="buttons">

                            <button id="start">

                                Start

                            </button>

                            <button id="pause">

                                Pause

                            </button>

                            <button id="reset">

                                Reset

                            </button>

                        </div>

                            <hr>

        </div>

            <div class="settings-panel" id="settingsPanel">

                <div class="settings-top">

                    <h2>⚙ Settings</h2>

                    <span id="closeModal">&times;</span>

                </div>

                <hr>

                <div class="theme-setting">

                    <h3>Theme</h3>

                    <div class="theme-buttons">

                        <button id="lightTheme" class="theme-btn light"></button>

                        <button id="redTheme" class="theme-btn red"></button>

                        <button id="blueTheme" class="theme-btn blue"></button>

                        <button id="greenTheme" class="theme-btn green"></button>

                        <button id="blackTheme" class="theme-btn black"></button>

                    </div>

                </div>

                <hr>

                <div class="timer-settings">

                    <h3>Timer Settings</h3>

                        <label>Focus (minutes)</label>

                        <input type="number" id="focusInput" min="1" max="180" value="25">


                        <label>Short Break (minutes)</label>

                        <input type="number" id="shortInput" min="1" max="60" value="5">

                        <label>Long Break (minutes)</label>

                        <input type="number" id="longInput" min="1" max="120" value="15">

                        <button id="saveTimer">Save</button>

                </div>

            </div>

        <audio id="bgMusic" loop></audio>

        <script src="script.js"></script>



    </body>

</html>
